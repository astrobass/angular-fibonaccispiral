<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fibonacci Spiral</title>
  </head>
  <body ng-app="myApp">
    <!-- 400x247 is the closest whole-pixel golden rectangle, so the
         figure fills the canvas instead of leaving a centred margin. -->
    <div fibonacci width="400" height="247"></div>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"
            integrity="sha384-quGekMf1ic6tIOn1GgLl0Pzra4ZkFyTcaDW3hZRjORqPQe3HnTKGl+lNPpuh7Lwv"
            crossorigin="anonymous"></script>
    <script src="fibSpiral.js"></script>
    <script>
      angular.module('myApp', ['fibonacci']);
    </script>
  </body>
</html>
