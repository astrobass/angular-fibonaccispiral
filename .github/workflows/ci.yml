name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Nothing in this workflow writes to the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # npm ci installs exactly what package-lock.json pins, and fails if the
      # lockfile and manifest disagree.
      - run: npm ci

      - name: Lint
        run: npm run lint

      # Karma launches ChromeHeadlessNoSandbox; the runner ships Chrome, and
      # CHROME_BIN tells karma-chrome-launcher where to find it.
      - name: Run tests
        run: npm test
        env:
          CHROME_BIN: /usr/bin/google-chrome
